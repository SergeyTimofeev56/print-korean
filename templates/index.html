<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Печать: {{ product.name }}</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --info-color: #555555;
            --border-color: #dddddd;
            --primary-blue: #007bff;
            --success-green: #28a745;
        }

        /* Стили для темной темы (автоматически при включении в системе) */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #121212;
                --card-bg: #1e1e1e;
                --text-color: #e0e0e0;
                --info-color: #b0b0b0;
                --border-color: #333333;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            width: 90%;
            max-width: 500px;
            border-radius: 16px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .info {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .info b { color: var(--primary-blue); }

        /* Навигация (кнопки под размер пальца) */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .btn {
            -webkit-appearance: none;
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-nav {
            background-color: var(--primary-blue);
            color: white;
            flex: 0 1 40%;
            text-align: center;
        }

        .btn-print {
            background-color: var(--success-green);
            color: white;
            width: 100%;
            margin-top: 15px;
        }

        .btn:disabled, .btn.disabled {
            background-color: #555;
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Поле ввода количества */
        .print-zone {
            background: rgba(0, 123, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        input[type="number"] {
            font-size: 1.5rem;
            width: 80px;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>{{ product.name }}</h1>

    <div class="info">
        <div><b>Содержимое:</b> {{ product.sostav }}</div>
        <div><b>Тип этикетки:</b> {{ product.typelabel}}</div>

    <!--    <div style="margin-top:10px;"><b>Масса:</b> {{ product.massa }}</div>   -->
        <div><b>ШК:</b> {{ product.barcode }}</div>
    </div>

    <div class="nav">
        {% if product.id > 1 %}
            <a href="{{ url_for('index', p_id=product.id - 1) }}" class="btn btn-nav">⬅ Назад</a>
        {% else %}
            <span class="btn btn-nav disabled">⬅ Назад</span>
        {% endif %}

        <span><b>{{ product.id }}</b> / {{ max_id }}</span>

        {% if product.id < max_id %}
            <a href="{{ url_for('index', p_id=product.id + 1) }}" class="btn btn-nav">Вперед ➡</a>
        {% else %}
            <span class="btn btn-nav disabled">Вперед ➡</span>
        {% endif %}
    </div>

    <div class="print-zone">
        <!--<form action="/print" method="post">  -->
        <form id="printForm">
            <input type="hidden" name="product_id" id="product_id" value="{{ product.id }}">
            <label for="qty">Количество этикеток:</label>
            <input type="number" id="qty" name="quantity" value="1" min="1" max="20">
            <!--<button type="submit" class="btn btn-print">🖨 ПЕЧАТЬ</button>-->
            <button type="button" class="btn btn-print" onclick="sendPrint()">🖨 ПЕЧАТЬ</button>
        </form>
    </div>
</div>
<script>
function sendPrint() {
    const form = document.getElementById('printForm');
    const formData = new FormData(form);
    const btn = document.querySelector('.btn-print');
    const statusDiv = document.getElementById('statusMessage');

    btn.disabled = true;
    const originalText = btn.innerHTML;
    btn.innerHTML = "⌛ Ждите...";

    fetch('/print', {
        method: 'POST',
        body: formData
    })
    .then(async response => {
        const isJson = response.headers.get('content-type')?.includes('application/json');
        const data = isJson ? await response.json() : null;

        if (!response.ok) {
            throw new Error(data?.message || 'Ошибка сервера');
        }

        // Успех
        statusDiv.style.display = "block";
        statusDiv.style.color = "var(--success-green)";
        statusDiv.innerText = "✅ Отправлено!";
        if (navigator.vibrate) navigator.vibrate(50); // Вибрация для мобилок
    })
    .catch(error => {
        console.error('Error:', error);
        statusDiv.style.display = "block";
        statusDiv.style.color = "red";
        statusDiv.innerText = "❌ Ошибка: " + error.message;
    })
    .finally(() => {
        btn.disabled = false;
        btn.innerHTML = originalText;
        setTimeout(() => { statusDiv.style.display = "none"; }, 4000);
    });
}
</script>

</body>
</html>
