<<!DOCTYPE html>
<html>
<head><title>Админка</title></head>
<body>
    <h1>Управление товарами</h1>
    <a href="/">На главную</a>
    <hr>
    <h3>Добавить новый товар</h3>
    <form action="/admin/add" method="POST">
        <input type="text" name="name" placeholder="Название" required>
        <input type="text" name="barcode" placeholder="Штрихкод">
    <!--    <input type="number" name="price" placeholder="Цена" step="0.01">  -->
        <br><textarea name="sostav" placeholder="Состав" rows="3" cols="50"></textarea>
        <input type="checkbox" name="formatfield" placeholder="Форматировать текст">
        <input type="text" name="typelabel" placeholder="Размер этикетки">
        <br><button type="submit">Добавить</button>
    </form>
    <hr>
    <table border="1">
        <tr>
            <th>ID</th><th>Название</th><th>Штрихкод</th><th>Форматировать</th><th>Размер этикетки</th><th>Действия</th>
        </tr>
        {% for p in products %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.barcode }}</td>
            <td>{{ p.formatfield }}</td>
            <td>{{ p.typelabel}}</td>
            <td>
                <a href="{{ url_for('edit_product', id=p.id) }}">Ред.</a>
                <a href="{{ url_for('delete_product', id=p.id) }}" onclick="return confirm('Удалить?')">Удалить</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
